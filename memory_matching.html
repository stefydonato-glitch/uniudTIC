<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory – Matching inglese/italiano</title>
<style>
  :root{--bg:#f4f1ea;--ink:#222;--card:#fff;--en:#2f6fed;--it:#e8743b;--ok:#2e9e5b;--bad:#d64545}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:16px}
  .wrap{max-width:900px;margin:0 auto}
  h1{margin:.2em 0;font-size:1.6rem}
  p.sub{margin:0 0 16px;color:#555}
  .menu{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .opt{background:#fff;border:3px solid #ddd;border-radius:16px;padding:18px;cursor:pointer;text-align:left;font:inherit}
  .opt:hover,.opt:focus-visible{border-color:var(--en);outline:none}
  .opt h2{margin:0 0 6px;font-size:1.2rem}
  .opt .tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;color:#fff;margin-bottom:8px}
  .t1{background:var(--ok)}.t2{background:var(--bad)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  label.chk{display:flex;gap:8px;align-items:center;background:#fff;padding:10px 14px;border-radius:12px}
  select,button.btn{font:inherit;padding:8px 12px;border-radius:10px;border:2px solid #ccc;background:#fff;cursor:pointer}
  button.btn:hover{border-color:var(--en)}
  .bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
  .stat{background:#fff;border-radius:12px;padding:8px 14px;font-weight:600}
  .stat.low{background:#ffe3e3;color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:560px){.grid{gap:6px}}
  .card{aspect-ratio:3/4;perspective:800px;border:0;background:none;padding:0;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .card.open .inner,.card.done .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;text-align:center}
  .back{background:repeating-linear-gradient(45deg,#4a5568,#4a5568 10px,#566074 10px,#566074 20px);color:#fff;font-size:2rem}
  .front{transform:rotateY(180deg);background:var(--card);border:4px solid var(--c)}
  .card.en{--c:var(--en)}.card.it{--c:var(--it)}
  .card.done .front{background:#e6f6ec;border-color:var(--ok)}
  .card.wrong .front{background:#fde8e8;border-color:var(--bad)}
  .emoji{font-size:clamp(2rem,9vw,3.6rem);line-height:1}
  .word{font-weight:700;font-size:clamp(.95rem,3.4vw,1.4rem);word-break:break-word}
  .lang{font-size:.65rem;letter-spacing:.08em;color:#777}
  .msg{min-height:1.6em;text-align:center;font-weight:600;margin:12px 0}
  .end{background:#fff;border-radius:16px;padding:22px;text-align:center}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🃏 Memory – Matching inglese / italiano</h1>
  <p class="sub">Scopri una carta in inglese (se ne ascolta la pronuncia) e una in italiano: se i termini corrispondono, hai fatto una coppia!</p>

  <!-- MENU -->
  <section id="menu">
    <div class="menu">
      <button class="opt" data-level="easy">
        <span class="tag t1">Più semplice</span>
        <h2>Livello 1 – Con immagine</h2>
        <div>Le carte in inglese mostrano l'<b>immagine</b> insieme al termine.</div>
      </button>
      <button class="opt" data-level="hard">
        <span class="tag t2">Più complesso</span>
        <h2>Livello 2 – Solo parola</h2>
        <div>Le carte in inglese mostrano <b>solo il termine</b>, senza immagine.</div>
      </button>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="useTimer"> Attiva la variabile TEMPO</label>
      <label>Minuti: <select id="minutes"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
    </div>
  </section>

  <!-- GIOCO -->
  <section id="game" class="hidden">
    <div class="bar">
      <div class="row" style="margin:0">
        <span class="stat" id="lvl"></span>
        <span class="stat">Tentativi: <span id="tries">0</span></span>
        <span class="stat">Coppie: <span id="pairs">0</span>/8</span>
        <span class="stat hidden" id="timerBox">⏱ <span id="timer">0:00</span></span>
      </div>
      <div class="row" style="margin:0">
        <button class="btn" id="replay" title="Riascolta">🔊 Riascolta</button>
        <label class="chk" style="padding:6px 10px"><input type="checkbox" id="audioOn" checked> Audio</label>
        <button class="btn" id="back">↩ Menu</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="end" class="end hidden">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <button class="btn" id="again">Rigioca</button>
    <button class="btn" id="toMenu">Menu</button>
  </section>
</div>

<script>
const WORDS = [
  {en:"dog",it:"cane",e:"🐶"},{en:"cat",it:"gatto",e:"🐱"},
  {en:"apple",it:"mela",e:"🍎"},{en:"house",it:"casa",e:"🏠"},
  {en:"sun",it:"sole",e:"☀️"},{en:"book",it:"libro",e:"📖"},
  {en:"car",it:"macchina",e:"🚗"},{en:"tree",it:"albero",e:"🌳"},
  {en:"fish",it:"pesce",e:"🐟"},{en:"bread",it:"pane",e:"🍞"},
  {en:"moon",it:"luna",e:"🌙"},{en:"flower",it:"fiore",e:"🌸"}
];
const $ = id => document.getElementById(id);
let level, cards, open = [], locked = false, tries = 0, pairs = 0, lastEn = null;
let timerId = null, left = 0, useTimer = false;

function speak(text){
  if(!$("audioOn").checked || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB"; u.rate = .85;
  speechSynthesis.speak(u);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

function start(lv){
  level = lv; open = []; locked = false; tries = 0; pairs = 0; lastEn = null;
  useTimer = $("useTimer").checked;
  const set = shuffle([...WORDS]).slice(0,8);
  cards = shuffle(set.flatMap(w=>[{w,lang:"en"},{w,lang:"it"}]));
  $("menu").classList.add("hidden"); $("end").classList.add("hidden"); $("game").classList.remove("hidden");
  $("lvl").textContent = lv==="easy" ? "Livello 1 – con immagine" : "Livello 2 – solo parola";
  $("tries").textContent = 0; $("pairs").textContent = 0; $("msg").textContent = "";
  const g = $("grid"); g.innerHTML = "";
  cards.forEach((c,i)=>{
    const b = document.createElement("button");
    b.className = "card "+c.lang; b.setAttribute("aria-label","Carta coperta "+(i+1));
    const showImg = c.lang==="en" && lv==="easy";
    b.innerHTML = `<div class="inner"><div class="face back">?</div><div class="face front">
      ${showImg?`<div class="emoji">${c.w.e}</div>`:""}
      <div class="word">${c.lang==="en"?c.w.en:c.w.it}</div>
      <div class="lang">${c.lang==="en"?"ENGLISH":"ITALIANO"}</div></div></div>`;
    b.onclick = ()=>flip(i,b);
    g.appendChild(b); c.el = b;
  });
  clearInterval(timerId);
  $("timerBox").classList.toggle("hidden",!useTimer);
  if(useTimer){
    left = parseInt($("minutes").value)*60; $("timer").textContent = fmt(left);
    $("timerBox").classList.remove("low");
    timerId = setInterval(()=>{
      left--; $("timer").textContent = fmt(left);
      $("timerBox").classList.toggle("low", left<=15);
      if(left<=0){finish(false)}
    },1000);
  }
}

function flip(i,el){
  const c = cards[i];
  if(locked || el.classList.contains("open") || el.classList.contains("done")) return;
  el.classList.add("open");
  if(c.lang==="en"){ lastEn = c.w.en; speak(c.w.en); }
  open.push(i);
  if(open.length===2){
    tries++; $("tries").textContent = tries; locked = true;
    const [a,b] = open.map(k=>cards[k]);
    if(a.w===b.w && a.lang!==b.lang){
      setTimeout(()=>{
        open.forEach(k=>{cards[k].el.classList.remove("open");cards[k].el.classList.add("done")});
        open=[]; locked=false; pairs++; $("pairs").textContent = pairs;
        $("msg").textContent = "✅ Esatto! "+a.w.en+" = "+a.w.it;
        if(pairs===8) finish(true);
      },700);
    } else {
      $("msg").textContent = (a.lang===b.lang) ? "❌ Servono una carta inglese e una italiana" : "❌ Non corrispondono, riprova";
      open.forEach(k=>cards[k].el.classList.add("wrong"));
      setTimeout(()=>{
        open.forEach(k=>cards[k].el.classList.remove("open","wrong"));
        open=[]; locked=false;
      },1200);
    }
  }
}

function finish(win){
  clearInterval(timerId); locked = true;
  setTimeout(()=>{
    $("game").classList.add("hidden"); $("end").classList.remove("hidden");
    $("endTitle").textContent = win ? "🎉 Bravo, hai trovato tutte le coppie!" : "⏰ Tempo scaduto!";
    $("endText").textContent = `Coppie trovate: ${pairs}/8 · Tentativi: ${tries}` + (useTimer&&win?` · Tempo rimasto: ${fmt(left)}`:"");
  }, win?600:0);
}

document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>start(b.dataset.level));
$("replay").onclick = ()=>lastEn && speak(lastEn);
$("again").onclick = ()=>start(level);
const toMenu = ()=>{clearInterval(timerId);speechSynthesis&&speechSynthesis.cancel();$("game").classList.add("hidden");$("end").classList.add("hidden");$("menu").classList.remove("hidden")};
$("back").onclick = toMenu; $("toMenu").onclick = toMenu;
</script>
</body>
</html>
